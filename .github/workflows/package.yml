name: Package extension

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the extension ZIP to
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.zip.outputs.archive }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create extension ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          archive="dist/localis-extension-v${version}.zip"
          mkdir -p dist
          files=(
            manifest.json \
            background.js \
            admin.html \
            newtab.html \
            css/base.css css/admin.css css/newtab.css \
            js/admin.js js/boot.js js/db.js js/io.js js/newtab.js js/render.js js/themes.js \
            lib/dexie.mjs lib/LICENSE \
            icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png
          )
          zip -q "$archive" "${files[@]}"

          expected="$(printf '%s\n' "${files[@]}" | sort)"
          actual="$(unzip -Z1 "$archive" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The extension ZIP contains unexpected or missing files"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: localis-extension
          path: ${{ steps.zip.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension ZIP
        uses: actions/download-artifact@v4
        with:
          name: localis-extension
          path: dist

      - name: Attach extension ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.package.outputs.archive }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber