<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <link rel="icon" href="icons/icon32.png">
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/newtab.css">
  <style id="theme-css"></style>
  <style id="user-css"></style>
</head>
<body class="scope">
  <a class="skip-link" href="#wrap">Skip to links</a>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <img src="icons/icon48.png" alt="" width="36" height="36">
        <div><h1 id="title"></h1><p id="subtitle"></p></div>
      </div>
      <div class="bar">
        <label class="search" id="search-box">
          <span class="search-label">Search</span>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Filter links or search the web…">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <div class="controls">
          <label class="ctl"><span>Theme</span><select id="theme-select"></select></label>
          <div class="ctl"><span id="layout-label">Layout</span>
            <div class="seg" id="layout-seg" role="group" aria-labelledby="layout-label">
              <button data-layout="auto" title="Automatic grid" aria-label="Automatic grid"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
              <button data-layout="vertical" title="Single column" aria-label="Single column"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
              <button data-layout="horizontal" title="Columns in a row" aria-label="Columns in a row"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg></button>
            </div>
          </div>
          <div class="ctl"><span id="size-label">Size</span>
            <div class="seg" id="size-seg" role="group" aria-labelledby="size-label">
              <button data-size="small" title="Small" aria-label="Small links">S</button>
              <button data-size="medium" title="Medium" aria-label="Medium links">M</button>
              <button data-size="large" title="Large" aria-label="Large links">L</button>
            </div>
          </div>
          <button id="admin-btn" class="admin-btn" title="Manage"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/><circle cx="12" cy="12" r="7"/></svg><span>Manage</span></button>
        </div>
      </div>
      <nav id="header-links" class="hlinks" aria-label="Header links"></nav>
    </div>
    <nav id="page-tabs" class="ptabs" aria-label="Pages" hidden></nav>
  </header>

  <main class="dash-wrap" id="wrap" tabindex="-1">
    <div id="dash"></div>
    <div id="empty" class="empty" hidden>
      <p>There is nothing here yet.</p>
      <button class="admin-btn" data-open-admin>Create my first section</button>
    </div>
    <p id="no-results" class="empty" hidden>No matches. Press <kbd>Enter</kbd> to search the web.</p>
  </main>

  <footer id="footer"></footer>
  <script type="module" src="js/newtab.js"></script>
</body>
</html>
