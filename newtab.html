<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <link rel="icon" href="icons/icon32.png">
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/newtab.css">
  <style id="theme-css"></style>
  <style id="user-css"></style>
</head>
<body class="scope">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
      <nav id="header-links" class="hlinks"></nav>
    </div>
    <div class="bar">
      <label class="search" id="search-box">
        <span class="search-label">Search</span>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Filter, or type 'g text' to search the web…">
      </label>
      <div class="controls">
        <label class="ctl"><span>Theme</span><select id="theme-select"></select></label>
        <div class="ctl"><span>Layout</span>
          <div class="seg" id="layout-seg">
            <button data-layout="auto" title="Automatic grid">▦</button>
            <button data-layout="vertical" title="Single column">☰</button>
            <button data-layout="horizontal" title="Columns in a row">▥</button>
          </div>
        </div>
        <div class="ctl"><span>Size</span>
          <div class="seg" id="size-seg">
            <button data-size="small" title="Small">S</button>
            <button data-size="medium" title="Medium">M</button>
            <button data-size="large" title="Large">L</button>
          </div>
        </div>
        <button id="admin-btn" class="admin-btn" title="Manage" aria-label="Manage"><span aria-hidden="true">⚙</span></button>
      </div>
    </div>
    <nav id="page-tabs" class="ptabs" role="tablist" aria-label="Pages" hidden></nav>
  </header>

  <main class="dash-wrap" id="wrap">
    <div id="dash"></div>
    <div id="empty" class="empty" hidden>
      <p>There is nothing here yet.</p>
      <button class="admin-btn" data-open-admin>Create my first section</button>
    </div>
    <p id="no-results" class="empty" hidden>No matches. Press <kbd>Enter</kbd> to search the web.</p>
  </main>

  <footer id="footer"></footer>
  <script type="module" src="js/newtab.js"></script>
</body>
</html>
